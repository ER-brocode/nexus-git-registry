name: CI Test & Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Verify Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Verify Dependencies
        run: go mod verify

      - name: Run Test Suite with Race Detector
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Compile Executable Binaries
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bin/nexus-linux-amd64 ./cmd/nexus
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o bin/nexus-darwin-arm64 ./cmd/nexus
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o bin/nexus-windows-amd64.exe ./cmd/nexus

      - name: Upload Test Coverage
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: coverage.txt

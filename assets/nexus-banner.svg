<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="git-orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f05032" />
      <stop offset="100%" stop-color="#ff7e5f" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" stroke="#1f2937" stroke-width="2" />

  <!-- Grid patterns -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="250" y1="0" x2="250" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="550" y1="0" x2="550" y2="360" />
    <line x1="700" y1="0" x2="700" y2="360" />
    <line x1="850" y1="0" x2="850" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
    <line x1="1150" y1="0" x2="1150" y2="360" />
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
  </g>

  <!-- Animated Ring 1 -->
  <circle cx="160" cy="180" r="70" fill="none" stroke="url(#accent-cyan)" stroke-width="3" opacity="0.8">
    <animateTransform attributeName="transform" type="rotate" from="0 160 180" to="360 160 180" dur="18s" repeatCount="indefinite" />
  </circle>

  <!-- Animated Ring 2 (Dashed) -->
  <circle cx="160" cy="180" r="50" fill="none" stroke="url(#git-orange)" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.9">
    <animateTransform attributeName="transform" type="rotate" from="360 160 180" to="0 160 180" dur="12s" repeatCount="indefinite" />
  </circle>

  <!-- Center Core Logo Symbol -->
  <polygon points="160,140 195,160 195,200 160,220 125,200 125,160" fill="#030712" stroke="#38bdf8" stroke-width="3" filter="url(#glow)">
    <animate attributeName="stroke" values="#00f2fe;#f05032;#00f2fe" dur="6s" repeatCount="indefinite" />
  </polygon>

  <!-- Inner Git Branch Nodes -->
  <circle cx="160" cy="170" r="6" fill="#38bdf8" />
  <circle cx="150" cy="195" r="5" fill="#f05032" />
  <circle cx="170" cy="195" r="5" fill="#f05032" />
  <line x1="160" y1="170" x2="150" y2="195" stroke="#94a3b8" stroke-width="2" />
  <line x1="160" y1="170" x2="170" y2="195" stroke="#94a3b8" stroke-width="2" />

  <!-- Title & Subtitles -->
  <text x="270" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="1">
    NEXUS <tspan fill="url(#accent-cyan)">GIT REGISTRY</tspan>
  </text>

  <text x="270" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#94a3b8">
    Distributed Git-Native Artifact Registry &amp; P2P Container Cache
  </text>

  <!-- Feature Pills -->
  <g transform="translate(270, 230)">
    <!-- Pill 1: OCI v1.1.0 -->
    <rect x="0" y="0" width="165" height="36" rx="18" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
    <text x="82" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle">OCI Spec v1.1.0</text>

    <!-- Pill 2: Git Storage Trees -->
    <rect x="180" y="0" width="180" height="36" rx="18" fill="#1e293b" stroke="#f05032" stroke-width="1.2" />
    <text x="270" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#ff7e5f" text-anchor="middle">Git Tree Objects</text>

    <!-- Pill 3: FastCDC -->
    <rect x="375" y="0" width="220" height="36" rx="18" fill="#1e293b" stroke="#10b981" stroke-width="1.2" />
    <text x="485" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#34d399" text-anchor="middle">FastCDC Deduplication</text>

    <!-- Pill 4: Ed25519 Signed -->
    <rect x="610" y="0" width="190" height="36" rx="18" fill="#1e293b" stroke="#a855f7" stroke-width="1.2" />
    <text x="705" y="23" font-family="sans-serif" font-size="13" font-weight="600" fill="#c084fc" text-anchor="middle">Ed25519 Signatures</text>
  </g>
</svg>
